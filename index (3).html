<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมทายคำศัพท์วิทยาศาสตร์</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right,#8fd3f4,#84fab0);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.game{
    background:white;
    width:420px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
    color:#2196F3;
}

#hint{
    font-size:20px;
    margin:20px 0;
    color:#333;
}

input{
    width:80%;
    padding:10px;
    font-size:18px;
    border-radius:10px;
    border:2px solid #2196F3;
    text-align:center;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#2196F3;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1976D2;
}

#result{
    font-size:20px;
    margin-top:15px;
    font-weight:bold;
}

.score{
    font-size:18px;
    margin-top:15px;
    color:#E91E63;
}
</style>

</head>
<body>

<div class="game">

<h1>🔬 เกมทายคำศัพท์วิทยาศาสตร์</h1>

<p><b>คำใบ้</b></p>
<h2 id="hint"></h2>

<input type="text" id="answer" placeholder="พิมพ์คำตอบ">

<br>

<button onclick="checkAnswer()">ตรวจคำตอบ</button>
<button onclick="nextQuestion()">ข้อถัดไป</button>

<h3 id="result"></h3>

<div class="score">
คะแนน : <span id="score">0</span>
</div>

</div>

<script>

const questions = [

{
hint:"ดาวที่ให้แสงสว่างแก่โลก",
answer:"ดวงอาทิตย์"
},

{
hint:"สิ่งมีชีวิตที่หายใจด้วยเหงือก",
answer:"ปลา"
},

{
hint:"ของเหลวที่เราดื่มทุกวัน",
answer:"น้ำ"
},

{
hint:"พืชสร้างอาหารด้วยกระบวนการนี้",
answer:"สังเคราะห์แสง"
},

{
hint:"สัตว์ที่บินได้และมีปีก",
answer:"นก"
},

{
hint:"สิ่งที่ใช้หายใจของมนุษย์",
answer:"ปอด"
},

{
hint:"ดาวเคราะห์ที่เราอาศัยอยู่",
answer:"โลก"
},

{
hint:"ส่วนของพืชที่ดูดน้ำ",
answer:"ราก"
}

];

let current = 0;
let score = 0;

document.getElementById("hint").innerHTML = questions[current].hint;

function checkAnswer(){

let ans = document.getElementById("answer").value.trim();

if(ans == questions[current].answer){

document.getElementById("result").innerHTML="✅ ตอบถูกต้อง";
document.getElementById("result").style.color="green";

score++;
document.getElementById("score").innerHTML=score;

}else{

document.getElementById("result").innerHTML="❌ ตอบผิด<br>เฉลย : "+questions[current].answer;
document.getElementById("result").style.color="red";

}

}

function nextQuestion(){

current++;

if(current>=questions.length){

alert("🎉 จบเกมแล้ว\nคะแนนของคุณ = "+score+" / "+questions.length);

current=0;
score=0;

document.getElementById("score").innerHTML=0;

}

document.getElementById("hint").innerHTML=questions[current].hint;

document.getElementById("answer").value="";
document.getElementById("result").innerHTML="";

}

</script>

</body>
</html>
